
{% extends "base.html" %}
{% block title %}Create Account - MediQR{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="logo-circle">+</div>
    <h1>Create Account</h1>
    <p class="subtitle">Create your emergency medical profile</p>

    <form method="POST">
        <label>Full Name</label>
        <input type="text" name="full_name" placeholder="Enter your full name" required>

        <label>Email Address</label>
        <input type="email" name="email" placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Create a password" minlength="8" required>

        <label>Confirm Password</label>
        <input type="password" name="confirm_password" placeholder="Confirm your password" minlength="8" required>

        <button type="submit" class="primary-btn">Create Account</button>
    </form>

    <p class="bottom-text">
        Already have an account?
        <a href="{{ url_for('login') }}">Login here</a>
    </p>
</div>
{% endblock %}
